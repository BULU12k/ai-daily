name: AI Daily

on:
  schedule:
    # 每半小时运行一次（UTC；日报按 Asia/Shanghai 时区分日）
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache CJK poster fonts
        uses: actions/cache@v4
        with:
          path: .fonts
          key: noto-sans-sc-ttf-v41-2026-10

      - name: Download CJK fonts (poster rendering)
        run: |
          mkdir -p .fonts
          if [ ! -f .fonts/NotoSansSC-Regular.ttf ]; then
            curl -fsSL --retry 3 -o .fonts/NotoSansSC-Regular.ttf \
              "https://fonts.gstatic.com/s/notosanssc/v41/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYw.ttf"
          fi
          if [ ! -f .fonts/NotoSansSC-Bold.ttf ]; then
            curl -fsSL --retry 3 -o .fonts/NotoSansSC-Bold.ttf \
              "https://fonts.gstatic.com/s/notosanssc/v41/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaGzjCnYw.ttf"
          fi
          ls -la .fonts

      - name: Install render dependencies
        run: npm ci

      - name: Fetch feeds, summarize, build pages
        env:
          # 优先级：ZAI/ZHIPU/GLM -> OPENAI -> GitHub Models（免费，用内置 GITHUB_TOKEN）
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node scripts/fetch-daily.mjs

      - name: Render poster PNG
        env:
          FONT_DIR: .fonts
        run: node scripts/render-poster.mjs
        # 渲染失败不阻塞日报页面发布；notify 会自动降级为纯文本推送
        continue-on-error: true

      - name: Maintain actual poster index (including empty batches)
        run: node scripts/maintain-posters.mjs

      - name: Commit generated pages, posters and dedupe state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily: $(TZ=Asia/Shanghai date +%F) $(TZ=Asia/Shanghai date +%H:%M)"
            git push
          fi

      - name: Push poster to ntfy
        env:
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node scripts/notify.mjs
        continue-on-error: true # 推送失败不阻塞日报发布，但会在日志中留 warning
